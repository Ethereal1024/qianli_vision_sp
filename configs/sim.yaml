#####-----仿真共享内存参数-----#####
sim_shm:
  camera_frames: "/dev/shm/sim_camera_frames"
  cboard_state:  "/dev/shm/sim_cboard_state"
  cboard_cmd:    "/dev/shm/sim_cboard_cmd"
  wait_timeout_ms: 8000
  open_retry_ms: 500
  # 画面时延补偿(ms)：帧头已带内容时刻，取 0；补偿量不当会使静止靶持续摆动
  frame_lag_ms: 0

#####-----运行参数-----#####
print_hz: 1.0
use_shooter: true
# 仿真对照实验用：标定参数取自仿真目标形状，不适用于真机
detect_thread: async  # async 在独立线程检测（真机流程），sync 在主循环内串行
command_hz: 500       # >0 按此频率重发指令（真机 CAN 500 Hz），0 每帧一次
diag: false           # 逐帧输出 [diag] 33 列，也可用环境变量 DIAG=1 开启

#####-----敌方颜色-----#####
enemy_color: "blue"

#####-----神经网络参数-----#####
backend: tensorrt
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.onnx
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
q_accel_xy: 12
q_accel_z: 24
q_accel_z_spin_w0: 3.0
q_accel_z_spin_scale: 2.0
q_accel_w: 5
q_accel_w_alpha0: 1.0
q_accel_w_alpha_scale: 0.6
q_accel_w_max_gain: 4
R_pitch: 2.7e-5
R_yaw: 1.5e-4

#####-----打符参数（只在 buff 模式读）-----#####
model: "assets/yolo11_buff_int8.xml"
fire_thresh: 0.0035
fire_gap_time: 0.700   # s
predict_time: 0.120    # s

#####-----aimer参数-----#####
yaw_offset: 0
pitch_offset: 0
comming_angle: 60
leaving_angle: 20
decision_speed: 8
# 发弹延迟(s)：仿真侧按 10 ms 的执行延迟建模
high_speed_delay_time: 0.010
low_speed_delay_time: 0.010

#####-----shooter参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
auto_fire: true
# 俯仰跟随门限（度）：超过该值不击发，<= 0 关闭
pitch_tolerance: 0

#####-----相机 / 下位机-----#####
camera_name: "sim"
cboard_name: "sim"
exposure_ms: 20


R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]


R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [-0.0305, 0, 0.0257]


image_size: [1440, 1080]
camera_matrix: [2414.935942, 0, 717.26243, 0, 2414.935942, 582.685405, 0, 0, 1]
distort_coeffs: [-0.020945, 0.150281, -0.000652, -0.001686, 0]
